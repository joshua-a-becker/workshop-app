# Treatments are generic. The negotiation scenario is NOT configured here — it
# comes from each player's `?scenario=<name>` URL param, which the server turns
# into {CLUB_BASE}/api/roles/<name>.json (see server/src/callbacks.js,
# roleDataUrlFor). A `roleDataURL` factor used to live here; it was never read
# and has been removed.
#
# Scenario-level settings (party count, prep_time, tips, debrief, price display)
# all come from that role JSON too, so the only factors left are the ones the
# server and client actually read.
factors:
    # Fallback game size for the lobby split preview. The real size is the number
    # of roles in the scenario's JSON (callbacks.js, scenarioPlayerCount); this is
    # only used when that can't be resolved yet.
    - name: playerCount
      desc: Fallback number of players per game when the scenario size is unknown.
      values:
        - value: 2
        - value: 3
        - value: 4
        - value: 5
        - value: 8
    # Duration of the post-negotiation debrief stage, in seconds. Read by
    # callbacks.js (onGameStart) and client/src/components/Timer.jsx, which hides
    # the countdown entirely when this exceeds 5 hours (i.e. self-paced).
    - name: debriefTime
      desc: Debrief stage duration in seconds; >18000 renders the stage self-paced.
      values:
        - value: 1800
        - value: 100000
treatments:
    - name: negotiation
      desc: Generic negotiation; the scenario comes from the player's ?scenario= link.
      factors:
        playerCount: 2
        debriefTime: 1800
